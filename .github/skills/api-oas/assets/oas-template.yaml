openapi: 3.0.3
info:
  title: <Feature> API
  version: 1.0.0
  description: <What the API does and who uses it.>
servers:
  - url: https://api.example.com/v1
    description: <Environment — replace with the project's real server(s)>
security:
  - bearerAuth: []
tags:
  - name: <Resources>
    description: <Operations on the resource>
paths:
  /<resources>:
    get:
      tags: [<Resources>]
      operationId: get<Resources>
      summary: List <resources>
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/<Resource>'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [<Resources>]
      operationId: create<Resource>
      summary: Create a <resource>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/<Resource>Request'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/<Resource>Response'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /<resources>/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [<Resources>]
      operationId: update<Resource>
      summary: Replace a <resource>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/<Resource>Request'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/<Resource>Response'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [<Resources>]
      operationId: delete<Resource>
      summary: Delete a <resource>
      responses:
        '204':
          description: Deleted (no body)
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identifier of the <resource>
      schema:
        type: integer
        format: int32
  schemas:
    <Resource>:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int32
          readOnly: true
          example: 1
        name:
          type: string
          maxLength: 100
          example: Sample
    <Resource>Request:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          example: Sample
    <Resource>Response:
      type: object
      required: [recordId]
      properties:
        recordId:
          type: integer
          format: int32
          example: 123
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
          example: /<resources>
    ErrorExtension:
      type: object
      required: [reference, detail]
      properties:
        reference:
          type: string
          description: Property path in dot notation (e.g. type.id)
          example: name
        detail:
          $ref: '#/components/schemas/ProblemDetail'
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          $ref: '#/components/schemas/ProblemDetail'
        extensions:
          type: array
          items:
            $ref: '#/components/schemas/ErrorExtension'
  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
