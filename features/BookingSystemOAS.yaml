openapi: 3.0.3
info:
  title: Booking API
  version: 1.0.0
  description: API for booking a user to an event.
servers:
  - url: https://api.example.com/api/v1
  - url: http://localhost:3000/api/v1
tags:
  - name: User
    description: Operations related to users.
  - name: Booking
    description: Operations related to booking.
  - name: Event
    description: Operations related to events.  

paths:
  /users/{id}:
    get:
      tags:
        - User
      operationId: getUserById
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userDto'
  /users/list:
    get:
      tags:
        - User
      operationId: getUsers
      summary: Get list of users
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/userDto'
  /events/{id}:
    get:
      tags:
        - Event
      operationId: getEventById
      summary: Get event by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventDto'
  /events/list:
    get:
      tags:
        - Event
      operationId: getEvents
      summary: Get list of events
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/eventDto'
  /bookings:
    post:
      tags:
        - Booking
      operationId: createBooking
      summary: Create a new booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bookingPayload'
      responses:
        '201':
          description: Booking created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createResponse'
    
components:
  schemas:
    userDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          example: "Bob"
        events:
          type: array
          items:
            $ref: '#/components/schemas/eventDto'
          example:
            - id: 456
              title: "Sample Event"
              date: "2024-06-01T10:00:00Z"
      required:
        - id
        - name
        - events
    bookingPayload:
      type: object
      properties:
        userId:
          type: integer
          format: int32
        eventId:
          type: integer
          format: int32
      required:
        - userId
        - eventId
    eventDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
          example: "Sample Event"
        date:
          type: string
          format: date-time
          example: "2024-06-01T10:00:00Z"
        users:
          type: array
          items:
            $ref: '#/components/schemas/userDto'
          example:
            - name: "Bob"
              events:
                - id: 456
                  title: "Sample Event"
                  date: "2024-06-01T10:00:00Z"
      required:
        - id
        - title
        - date
    createResponse:
      type: object
      properties:
        id:
          type: integer
          example: 789 