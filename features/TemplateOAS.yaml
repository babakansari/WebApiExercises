openapi: 3.0.3
info:
  title: OpenAPI Specification Template
  version: 1.0.0
  description: >-
    Template for creating an OpenAPI specification. The Help operations,
    schemas, server URLs, and security configuration are samples and do not
    describe a real API. Copy this file and replace or adapt the metadata,
    servers, security, tags, paths, and components for your API, following
    API-Design-System.yaml.
servers:
  - url: https://api.example.com/api
    description: Sample CI/CD server URL; replace for your API.
  - url: http://localhost:3000/api
    description: Sample local development server URL; replace for your API.
security:
  - bearerAuth: []
tags:
  - name: Help
    description: Sample Help operations; replace with your API's operations.
paths:
  /Help:
    get:
      tags: [Help]
      operationId: getHelp
      summary: 'Sample: Get help'
      description: Sample GET operation; replace or adapt it for your API.
      responses:
        '200':
          description: Help information retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpResponse'
              example:
                Id: 1
                Subject: Help with my account
    post:
      tags: [Help]
      operationId: postHelp
      summary: 'Sample: Submit a help request'
      description: Sample POST operation; replace or adapt it for your API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HelpRequest'
            example:
              Subject: Help with my account
      responses:
        '200':
          description: Help request processed successfully.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Sample OAuth 2.0 / OIDC bearer access token; adapt for your API.
  schemas:
    HelpResponse:
      type: object
      description: Sample help item returned by the API.
      required: [Id, Subject]
      properties:
        Id:
          type: integer
          format: int32
          readOnly: true
          description: Identifier of the help item.
          example: 1
        Subject:
          type: string
          description: Subject of the help item.
          example: Help with my account
    HelpRequest:
      type: object
      description: Sample payload for submitting a help request.
      required: [Subject]
      properties:
        Subject:
          type: string
          description: Subject of the help request.
          example: Help with my account