openapi: 3.0.3
info:
  title: OpenAPI Specification Template
  version: 1.0.0
  description: >-
    Template for creating an OpenAPI specification. The sample resource operations,
    schemas, server URLs, and security configuration are samples and do not
    describe a real API. Copy this file and replace or adapt the metadata,
    servers, security, tags, paths, and components for your API, following
    API-Design-System.yaml.
servers:
  - url: https://api.example.com/api
    description: Sample CI/CD server URL; replace for your API.
  - url: http://localhost:3000/api
    description: Sample local development server URL; replace for your API.
security:
  - bearerAuth: []
tags:
  - name: SampleResources
    description: Sample resource operations; replace with your API's operations.
paths:
  /sample-resources:
    get:
      tags: [SampleResources]
      operationId: getSampleResources
      summary: 'Sample: Get sample resources'
      description: Sample GET operation; replace or adapt it for your API.
      responses:
        '200':
          description: Sample resources retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleResourceResponse'
              example:
                id: 1
                name: Example resource
    post:
      tags: [SampleResources]
      operationId: createSampleResource
      summary: 'Sample: Create a sample resource'
      description: Sample POST operation; replace or adapt it for your API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SampleResourceRequest'
            example:
              name: Example resource
      responses:
        '200':
          description: Sample resource created successfully.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Sample OAuth 2.0 / OIDC bearer access token; adapt for your API.
  schemas:
    SampleResourceResponse:
      type: object
      description: Sample resource returned by the API.
      required: [id, name]
      properties:
        id:
          type: integer
          format: int32
          readOnly: true
          description: Identifier of the sample resource.
          example: 1
        name:
          type: string
          description: Name of the sample resource.
          example: Example resource
    SampleResourceRequest:
      type: object
      description: Sample payload for creating a resource.
      required: [name]
      properties:
        name:
          type: string
          description: Name of the sample resource.
          example: Example resource