openapi: 3.0.3
info:
  title: Ground Event API
  version: 1.0.0
  description: >-
    Manages flight Ground Events (e.g. maintenance, cleaning, fueling) and their types
    for the Sample Flight application. Errors follow an RFC 9457 ProblemDetail-based
    structure with optional property-level extensions.
servers:
  - url: https://api.example.com/api/v1
    description: For CI/CD environment
  - url: http://localhost:3000/api/v1
    description: For local development environment
security:
  - bearerAuth: []
tags:
  - name: GroundEventTypes
    description: Lookup of available Ground Event Types.
  - name: GroundEvents
    description: Create, read, update and delete Ground Events.
paths:
  /groundeventtypes:
    get:
      tags: [GroundEventTypes]
      operationId: getGroundEventTypes
      summary: Get Ground Event Types
      description: Fetch all Ground Event Types.
      responses:
        '200':
          description: List of Ground Event Types.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroundEventType'
              example:
                - id: 1
                  name: Maintenance
                - id: 2
                  name: Cleaning
                - id: 3
                  name: Fueling
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /groundevents:
    get:
      tags: [GroundEvents]
      operationId: getGroundEvents
      summary: Get Ground Events
      description: Fetch all Ground Events.
      responses:
        '200':
          description: List of Ground Events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroundEvent'
              example:
                - id: 123
                  type:
                    id: 1
                    name: Maintenance
                  airline: AC
                  aircraft: C-FABC
                  station: YYZ
                  priority: High
                  startUTC: '2026-11-08T10:00:00Z'
                  endUTC: '2026-11-08T12:00:00Z'
                - id: 124
                  type:
                    id: 2
                    name: Cleaning
                  airline: AC
                  aircraft: C-FXYZ
                  station: YUL
                  priority: Normal
                  startUTC: '2026-11-08T13:00:00Z'
                  endUTC: '2026-11-08T14:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [GroundEvents]
      operationId: createGroundEvent
      summary: Create a Ground Event
      description: Create a new Ground Event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroundEventRequest'
            example:
              type:
                id: 1
              airline: AC
              aircraft: C-FABC
              station: YYZ
              priority: High
              startUTC: '2026-11-08T10:00:00Z'
              endUTC: '2026-11-08T12:00:00Z'
      responses:
        '201':
          description: Ground Event created.
          headers:
            Location:
              description: URL of the created Ground Event.
              schema:
                type: string
                format: uri-reference
                example: /groundevents/123
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroundEventResponse'
              example:
                recordId: 123
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /groundevents/{refID}:
    parameters:
      - $ref: '#/components/parameters/RefId'
    put:
      tags: [GroundEvents]
      operationId: updateGroundEvent
      summary: Update a Ground Event
      description: Update (fully replace) an existing Ground Event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroundEventRequest'
            example:
              type:
                id: 1
              airline: AC
              aircraft: C-FABC
              station: YYZ
              priority: High
              startUTC: '2026-11-08T10:00:00Z'
              endUTC: '2026-11-08T12:00:00Z'
      responses:
        '200':
          description: Ground Event updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroundEventResponse'
              example:
                recordId: 123
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [GroundEvents]
      operationId: deleteGroundEvent
      summary: Delete a Ground Event
      description: Delete an existing Ground Event.
      responses:
        '204':
          description: Ground Event deleted. No response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 / OIDC bearer access token (organization standard).
  parameters:
    RefId:
      name: refID
      in: path
      required: true
      description: Identifier of the Ground Event.
      schema:
        type: integer
        format: int32
        minimum: 1
        example: 123
  schemas:
    GroundEventType:
      type: object
      description: A category of Ground Event.
      required: [id, name]
      properties:
        id:
          type: integer
          format: int32
          description: Ground Event Type identifier.
          example: 1
        name:
          type: string
          description: Ground Event Type name.
          example: Maintenance
    GroundEventTypeReference:
      type: object
      description: Reference to an existing Ground Event Type by identifier.
      required: [id]
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          description: Identifier of an existing Ground Event Type.
          example: 1
    GroundEvent:
      type: object
      description: A Ground Event scheduled for an aircraft at a station.
      required: [id, type, airline, aircraft, station, priority, startUTC, endUTC]
      properties:
        id:
          type: integer
          format: int32
          readOnly: true
          description: Ground Event identifier.
          example: 123
        type:
          $ref: '#/components/schemas/GroundEventType'
        airline:
          type: string
          description: Airline code.
          example: AC
        aircraft:
          type: string
          description: Aircraft identifier (e.g. registration).
          example: C-FABC
        station:
          type: string
          description: Station (airport) code.
          example: YYZ
        priority:
          type: string
          description: Priority value. Allowed values are not yet defined.
          example: High
        startUTC:
          type: string
          format: date-time
          description: Start date-time in UTC (ISO 8601).
          example: '2026-11-08T10:00:00Z'
        endUTC:
          type: string
          format: date-time
          description: End date-time in UTC (ISO 8601).
          example: '2026-11-08T12:00:00Z'
    GroundEventRequest:
      type: object
      description: Payload to create or update a Ground Event.
      required: [type, airline, aircraft, station, priority, startUTC, endUTC]
      properties:
        type:
          $ref: '#/components/schemas/GroundEventTypeReference'
        airline:
          type: string
          minLength: 1
          description: Airline code.
          example: AC
        aircraft:
          type: string
          minLength: 1
          description: Aircraft identifier (e.g. registration).
          example: C-FABC
        station:
          type: string
          minLength: 1
          description: Station (airport) code.
          example: YYZ
        priority:
          type: string
          minLength: 1
          description: Priority value. Allowed values are not yet defined.
          example: High
        startUTC:
          type: string
          format: date-time
          description: Start date-time in UTC (ISO 8601).
          example: '2026-11-08T10:00:00Z'
        endUTC:
          type: string
          format: date-time
          description: End date-time in UTC (ISO 8601).
          example: '2026-11-08T12:00:00Z'
    GroundEventResponse:
      type: object
      description: Result of a create or update operation.
      required: [recordId]
      properties:
        recordId:
          type: integer
          format: int32
          description: Identifier of the created or updated Ground Event.
          example: 123
    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details object.
      required: [status, title]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI reference identifying the problem type.
        title:
          type: string
          description: Short, human-readable summary of the problem.
          example: Validation failed
        status:
          type: integer
          format: int32
          description: HTTP status code; must match the response status.
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying this occurrence.
          example: /groundevents
    GroundEventErrorExtension:
      type: object
      description: Property-specific error.
      required: [reference, detail]
      properties:
        reference:
          type: string
          description: Property path in dot notation (e.g. type.id, airline).
          example: type.id
        detail:
          $ref: '#/components/schemas/ProblemDetail'
    GroundEventErrorResponse:
      type: object
      description: Error response with a general problem and optional property-level errors.
      required: [detail]
      properties:
        detail:
          $ref: '#/components/schemas/ProblemDetail'
        extensions:
          type: array
          description: Property-specific errors.
          items:
            $ref: '#/components/schemas/GroundEventErrorExtension'
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GroundEventErrorResponse'
          example:
            detail:
              status: 400
              title: Validation failed
              instance: /groundevents
            extensions:
              - reference: type.id
                detail:
                  status: 400
                  title: Invalid reference
                  instance: /groundevents
    Forbidden:
      description: The caller is not allowed to perform this operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GroundEventErrorResponse'
          example:
            detail:
              status: 403
              title: Forbidden
              instance: /groundevents
    NotFound:
      description: The requested resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GroundEventErrorResponse'
          example:
            detail:
              status: 404
              title: Ground Event not found
              instance: /groundevents/123
    InternalServerError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GroundEventErrorResponse'
          example:
            detail:
              status: 500
              title: Internal server error
              instance: /groundevents
